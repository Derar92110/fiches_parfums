name: photos-parfumo
on:
  push:
    branches: [claude/project-thread-1nna1e]
    paths: [photos/lancer.txt]
permissions:
  contents: write
jobs:
  dl:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix: { shard: [0, 1, 2, 3, 4, 5, 6, 7] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          export SHARD=${{ matrix.shard }}/8
          export LIMIT=$(grep -o 'LIMIT=[0-9]*' photos/lancer.txt | cut -d= -f2)
          node scripts/photos-parfumo.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.shard }}
          path: photos/
  fusion:
    needs: dl
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: parts }
      - run: pip install pillow && python3 scripts/photos-webp.py && cp parts/part-0/debug_*.html photos/ 2>/dev/null || true
      - run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add site/img photos/parfumo.json; git add photos/debug_*.html 2>/dev/null || true; git commit -m "Photos Parfumo" && git pull --rebase -q origin claude/project-thread-1nna1e && git push origin HEAD:claude/project-thread-1nna1e
