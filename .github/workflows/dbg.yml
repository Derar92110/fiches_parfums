name: dbg
on:
  push:
    branches: [claude/project-thread-1nna1e]
    paths: [scripts/dbg.mjs]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/dbg.mjs
      - run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add photos/dbg && git commit -m "dbg" && git pull --rebase -q origin claude/project-thread-1nna1e && git push origin HEAD:claude/project-thread-1nna1e
