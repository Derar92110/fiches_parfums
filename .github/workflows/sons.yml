name: sons
on:
  push:
    branches: [claude/project-thread-i21kjr]
    paths: [sons/demande.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sons:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/sons.mjs
      - run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add sons && git commit -m "Banque de sons" && git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME}
