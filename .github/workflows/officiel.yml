name: officiel
on:
  push:
    branches: [claude/project-thread-i21kjr]
    paths: [officiel/demande.json, scripts/officiel.mjs]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  officiel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/officiel.mjs
      - name: telecharger (hors YouTube)
        continue-on-error: true
        run: |
          pip install -q yt-dlp; sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p officiel/videos
          node -e "JSON.parse(require('fs').readFileSync('officiel/trouve.json')).videos.filter(u=>!/youtu/i.test(u)&&!/\.(webm)$/i.test(u)).slice(0,40).forEach(u=>console.log(u))" | while read u; do
            case "$u" in
              *.mp4*|*.mov*) curl -sL -w "%{http_code} %{size_download} %{content_type} $u\n" --max-filesize 45000000 -o "officiel/videos/$(echo "$u" | md5sum | cut -c1-10).mp4" "$u" | tee -a officiel/statut.txt || true ;;
              *) yt-dlp --no-playlist -f "b[height<=1920]/b" --max-filesize 45M -o "officiel/videos/%(id)s.%(ext)s" "$u" || true ;;
            esac
          done
          find officiel/videos -size -50k -exec sh -c 'echo "--- $1"; head -c 300 "$1"; echo' _ {} \; | tee -a officiel/statut.txt; find officiel/videos -size -50k -delete
          for f in officiel/videos/*; do echo "$f $(ffprobe -v error -show_entries format=duration:stream=width,height -of csv=p=0 "$f" | tr '\n' ' ')"; done | tee officiel/videos/liste.txt
      - run: |
          find officiel -size +45M -delete
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add officiel && git commit -m "Videos officielles trouvees" && git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME}
