name: photos-hd
on:
  push:
    branches: [claude/project-thread-1nna1e]
    paths: [photos/lancer-hd.txt]
permissions:
  contents: write
jobs:
  dl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          export SHARD=${{ matrix.shard }}/4
          export LIMIT=$(grep -o 'LIMIT=[0-9]*' photos/lancer-hd.txt | cut -d= -f2)
          node scripts/photos-hd.mjs
          mkdir -p out && mv photos/hd out/ && mv photos/hd.json out/hd-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: hd-${{ matrix.shard }}
          path: out/
  fusion:
    needs: dl
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - run: |
          mkdir -p photos/hd && for d in parts/*/; do cp -r $d/hd/* photos/hd/ 2>/dev/null; cp $d/*.json photos/ ; done; ls photos/hd | wc -l
      - run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add photos/hd photos/hd-*.json && git commit -m "Photos HD" && git pull --rebase -q origin claude/project-thread-1nna1e && git push origin HEAD:claude/project-thread-1nna1e
