name: tomford
on:
  push:
    branches: [claude/project-thread-1nna1e]
    paths: [tf/*.mjs]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tf/$(ls -t tf/*.mjs | head -1 | xargs basename)
      - run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add tf/out && git commit -m "tf" && git pull --rebase -q origin claude/project-thread-1nna1e && git push origin HEAD:claude/project-thread-1nna1e
