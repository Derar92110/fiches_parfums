name: photos-marques
on:
  push:
    branches: [claude/project-thread-1nna1e]
    paths: [work/run.mjs]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node work/run.mjs
      - run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add work/out && git commit -m "work" && git pull --rebase -q origin claude/project-thread-1nna1e && git push origin HEAD:claude/project-thread-1nna1e
